name: release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to:
#  1. build the wheel + sdist and attach them to a GitHub Release, and
#  2. build, smoke-test and push the Docker image to ghcr.io/<owner>/quant-skills.
# Both stay private while the repository is private.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push to GitHub Container Registry

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Version must match the tag
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $v"; exit 1; }
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/python -c "import quantskills.strategies as s, quantskills.fundamental as f; print(len(s.STRATEGIES), f.dcf_value(f.example_case()).per_share)"
          /tmp/clean/bin/qs-terminal --help
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "quant-skills $GITHUB_REF_NAME" \
            --notes "Wheel and source package for quantskills $GITHUB_REF_NAME. Install: \`gh release download $GITHUB_REF_NAME -R $GITHUB_REPOSITORY -p '*.whl' && pip install quantskills-*.whl\`. Docker: \`docker run -it --rm ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}\`. Research code: backtests are illustrations, not forecasts."

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: quant-skills:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint python quant-skills:test -c \
            "from quantskills.terminal.app import QSTerminal; from quantskills.strategies import STRATEGIES; print('ok', len(STRATEGIES))"
          docker run --rm quant-skills:test --help
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
