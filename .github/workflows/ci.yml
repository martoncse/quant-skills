name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes exact tags only (no moving v10)
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Execute demo notebooks
        run: |
          for nb in skills/*/demo.ipynb; do
            uv run jupyter nbconvert --execute --to notebook --output-dir /tmp/nb "$nb"
          done
