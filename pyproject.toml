[project]
name = "quantskills"
version = "0.1.0"
description = "A tested library of quant-research skills: data, features, backtesting, evaluation, robustness."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
    "textual>=0.80",
    "textual-plotext>=1.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "arch>=7.0",
    "lightgbm>=4.3",
]

[project.scripts]
qs-terminal = "quantskills.terminal.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "nbconvert>=7",
    "nbformat>=5",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantskills"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
